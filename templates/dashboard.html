{% extends "base.html" %}

{% block title %}
Dashboard - Real Estate System
{% endblock %}

{% block content %}

<h1>Dashboard</h1>

<p>
    Welcome back, {{ current_user.name }}!
</p>

<section>

    <div>

        <h3>My Properties</h3>

        <a href="{{ url_for('property.my_properties') }}">
            View Properties
        </a>

    </div>

</section>


<section>

    <h2>Quick Actions</h2>

    <a href="{{ url_for('property.add_property') }}">
        Add New Property
    </a>

</section>

{% endblock %}
